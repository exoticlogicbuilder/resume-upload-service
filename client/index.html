<!-- client/index.html -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Resume Upload Test</title>
  <style>body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial; padding:18px; max-width:700px;} label,input,button{display:block;margin:8px 0;} #status{margin-top:12px}</style>
</head>
<body>
  <h2>Resume Upload Test</h2>
  <p>Choose a PDF (max 2MB)</p>
  <input id="file" type="file" accept="application/pdf" />
  <input id="userId" placeholder="userId (optional)" />
  <button id="upload">Upload</button>
  <div id="status"></div>

  <script>
    const fileInput = document.getElementById('file');
    const uploadBtn = document.getElementById('upload');
    const status = document.getElementById('status');
    const userIdInput = document.getElementById('userId');

    const MAX_SIZE = 2 * 1024 * 1024; // 2MB

    uploadBtn.addEventListener('click', async () => {
      status.textContent = '';
      status.style.color = '';
      const f = fileInput.files[0];
      if (!f) {
        status.textContent = 'Please choose a file.';
        status.style.color = '#d32f2f';
        return;
      }
      if (f.type !== 'application/pdf') {
        status.textContent = 'Only PDF files are allowed.';
        status.style.color = '#d32f2f';
        return;
      }
      if (f.size > MAX_SIZE) {
        status.textContent = 'File is too large. Maximum size is 2MB.';
        status.style.color = '#d32f2f';
        return;
      }

      const fd = new FormData();
      fd.append('file', f);
      const uid = userIdInput.value.trim();
      if (uid) fd.append('userId', uid);

      status.textContent = 'Uploading...';

      try {
        const resp = await fetch('/api/resumes', { method: 'POST', body: fd });
        const json = await resp.json();
        
        if (!resp.ok) {
          throw new Error(json.message || 'Upload failed');
        }
        
        const record = json.data || {};
        const filename = record.filename || json.filename;
        const uploadedAt = record.upload_date || json.uploaded_at;
        const fileLink = record.file_url || json.fileUrl || json.url;

        status.innerHTML = `✅ Upload successful — <strong>${filename || 'resume'}</strong><br>
                           <small>Uploaded: ${uploadedAt ? new Date(uploadedAt).toLocaleString() : 'Unknown'}</small><br>
                           ${fileLink ? `<a href="${fileLink}" target="_blank">📄 Open file</a>` : ''}`;
      } catch (err) {
        status.innerHTML = `❌ Error: ${err.message || err}`;
        status.style.color = '#d32f2f';
      }
    });
  </script>
</body>
</html>
